[workspace]

resolver = "3"
members = [
    "crates/seruq-ffr",
    "crates/seruq-test-runtime",
    "crates/seruq-ucr",
    "crates/seruq-ucr-json",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/naoshinn/seruq"

[workspace.dependencies]
seruq-ffr = { path = "crates/seruq-ffr", version = "0.1.0" }
seruq-ucr = { path = "crates/seruq-ucr", version = "0.1.0" }
seruq-ucr-json = { path = "crates/seruq-ucr-json", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
winit = "0.30"
softbuffer = "0.4"
tiny-skia = "0.12"
cosmic-text = "0.19"

[workspace.lints.rust]
unsafe_code = "deny"
