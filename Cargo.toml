[workspace]

resolver = "3"
members = ["crates/seruq-ucr", "crates/seruq-ucr-json"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/naoshinn/seruq"

[workspace.dependencies]
seruq-ucr = { path = "crates/seruq-ucr", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace.lints.rust]
unsafe_code = "deny"
